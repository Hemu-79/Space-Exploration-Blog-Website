<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --bgclr: rgb(162, 162, 208);
      }
      .box {
        height: 200px;
        width: 100px;
        background-color: var(--bgclr);
        margin: 5px;
        display: grid;
      }
      .container {
        display: grid;
        /* grid-template-columns: 1fr 1fr 2fr 1fr; */
        /* grid-template-rows: 200px 200px; */
        grid-auto-rows: 200px;
        grid-auto-columns: 100px;
        grid-auto-flow: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
